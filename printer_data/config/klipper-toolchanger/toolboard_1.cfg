# This file contains common pin mappings for the BigTreeTech EBB2209
# when setup for t1

#####################################################################
#   MCU Definition
#####################################################################

[mcu toolboard_1]
canbus_uuid: f28a33c98d95

#####################################################################
#   Extruder
#####################################################################

[extruder1]
step_pin: toolboard_1: PB9
dir_pin: !toolboard_1: PB8
enable_pin: !toolboard_1: PB7
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  
##  Current extruder: WWG2
##--------------------------------------------------------------------
rotation_distance: 22.3399
##--------------------------------------------------------------------
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200

nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_cross_section: 1.75
max_extrude_only_distance: 250

#####################################################################
#   Heater
#####################################################################

heater_pin: toolboard_1: PA7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: toolboard_1: PA6
pullup_resistor: 2200
control: pid
pid_kp: 24.751
pid_ki: 2.292
pid_kd: 66.828
min_temp: -200
max_temp: 310
min_extrude_temp: -200
##--------------------------------------------------------------------
## Pressure Advance
pressure_advance: 0.0276             # Try to keep pressure_advance below 1.0
pressure_advance_smooth_time: 0.040  # Default is 0.040, leave stock
##--------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: toolboard_1: PC14
run_current: 0.350
sense_resistor: 0.110

#####################################################################
#   Fan Control
#####################################################################

[multi_pin toolboard_1_fan]
pins: toolboard_1:PB13, toolboard_1:PB15

[fan_generic part_fan_t1]
##  Print Cooling Fan
pin: multi_pin:toolboard_1_fan
kick_start_time: 0.5
off_below: 0.10

[heater_fan extruder1_fan]
##  Hotend fan
pin: toolboard_1: PA9
heater: extruder
heater_temp: 50.0

#####################################################################
#   Toolhead 0 LEDs
#####################################################################

[neopixel th_leds_t1]
pin: toolboard_1: PA15
chain_count: 3
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

#####################################################################
#   Toolhead 0 Filament runout switch
#####################################################################

#####################################################################
#   Accelerometer
#####################################################################

[adxl345 toolboard_1]
cs_pin: toolboard_1: PB12
spi_software_sclk_pin: toolboard_1: PB10
spi_software_mosi_pin: toolboard_1: PB11
spi_software_miso_pin: toolboard_1: PB2

#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor toolboard_1]
sensor_type: temperature_mcu
sensor_mcu: toolboard_1
min_temp: 0
max_temp: 100

# [temperature_sensor EBB_NTC]
# sensor_type: Generic 3950
# sensor_pin: toolboard_1: PA2

#####################################################################
#   gcode_macro t1
#####################################################################

[gcode_macro t1]
variable_color: ""
variable_tool_number: 1
gcode:
  _CHANGE_TOOL T={tool_number}

#####################################################################
#   Tool Definition t1
#####################################################################

[tool t1]
tool_number: 1
extruder: extruder
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 42
params_detach_x: 47
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 61.4
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 51.8

#####################################################################
#   Tool1 Button Detect
#   Beacon is our probe, Klipper doesn't like more than 1 probe.
#####################################################################

[gcode_button tool1_detect]
pin: ^toolboard_1: PA10
press_gcode:

#####################################################################
#   Tool Probe Definition t1
#####################################################################

[tool_probe t1]
pin: ^toolboard_1: PA10
tool: 1
z_offset: 0.0
speed: 2.0
lift_speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder
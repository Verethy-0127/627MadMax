[include mainsail.cfg]
[include macros.cfg]
[include klipper-toolchanger/*.cfg]

[mcu]
canbus_uuid: 484af6f65cb3

[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 10000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
gcode:
    {% if not (printer.pause_resume.is_paused) %}
        RESPOND MSG="Idle timeout reached"
        TURN_OFF_HEATERS
        M84
        #halo_off
        #SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=hotend_fan TARGET=45
        #SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_heater TARGET=0

    {% endif %}
timeout: 7200

[exclude_object]

[resonance_tester]
accel_chip: lis2dw toolboard_0
probe_points: 150, 150, 20
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[force_move]
enable_force_move: true

[save_variables]
filename: ~/printer_data/config/klipper-toolchanger/offset_save_file.cfg

[respond]

#####################################################################
#   X/Y Stepper Settings
#####################################################################

[stepper_x]
##  Connected to Motor 1 (B Motor)
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: ^!toolboard_0:PB8
position_min: -4
position_endstop: 295
position_max: 295
homing_speed: 80   #Max 100
homing_retract_dist: 10
second_homing_speed: 5

[tmc2209 stepper_x]
uart_pin: PD11
interpolate: False
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0

[stepper_y]
##  Connected to Motor 2 (A Motor)
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG15
position_min: -10
position_endstop: 320
position_max: 320
homing_speed: 80 #Max 100
homing_retract_dist: 10
second_homing_speed: 5

[tmc2209 stepper_y]
uart_pin: PC6
interpolate: False
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left - Motor 4
[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 4
microsteps: 16
endstop_pin: probe:z_virtual_endstop

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
#position_endstop: -0.5

position_max: 250
position_min: -5
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: PF2
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left - Motor 5
[stepper_z1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 4
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right - Motor 6
[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 4
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 0
max_temp: 120

#pwm_cycle_time: 0.0167
control: pid
pid_kp: 56.954
pid_ki: 2.601
pid_kd: 311.821

#####################################################################
#   Temperature Sensors
#####################################################################

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu

#####################################################################
#   Fan Control
#####################################################################

[controller_fan elec_fan]
pin: PD14
kick_start_time: 0.5
fan_speed: 0.6
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2


#driver fans
[multi_pin mcu_fan]
pins: PD12, PD13
 
[controller_fan driver_fan]
pin: multi_pin:mcu_fan
kick_start_time: 0.5
fan_speed: 0.6
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[z_tilt]
z_positions:
   -50, 6
   150, 339
   350, 6
points:
   60, 35
   150, 220
   240, 35
speed: 200
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.0075

#####################################################################
#   Bed Mesh
#####################################################################

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 40, 40
mesh_max: 260, 260
probe_count: 5,5
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0
zero_reference_position: 150, 150
adaptive_margin: 5

#####################################################################
#   LEDs
#####################################################################

[output_pin caselight]
pin: PB11
pwm: true
value: 20
shutdown_value: 0
scale: 100
cycle_time: 0.010

#####################################################################
#   Fake Heater
#####################################################################

[heater_generic chamber_heater]
heater_pin: PD15 # this is the fan pin that controls bed fans
sensor_type: Generic 3950 
sensor_pin: PF4 # this is a chamber thermistor

#Do not touch pid info or anything below here
control: pid 
pid_Kp: 61.470837
pid_Ki: 0.5
pid_Kd: 0
pwm_cycle_time: 0.3
min_temp: 1
max_temp: 150

#Do not touch pid info or anything here
[verify_heater chamber_heater]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 1

